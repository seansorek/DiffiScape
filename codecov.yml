# Codecov configuration for DiffiScape's R + Python (JAX/torch) codebase.
#
# Coverage is uploaded by separate workflows, each with its own flag:
#   - r      : R/                          (test-coverage.yml, via covr::codecov)
#   - python : inst/python/diff_cs/        (python.yml, via pytest-cov)
#   - jax    : inst/python/diffiscape_jax/ (python.yml, via pytest-cov)
#
# `carryforward: true` keeps a flag's last-known coverage when a PR touches only
# one language/backend, so e.g. a Python-only PR doesn't blank out the R numbers.

codecov:
  require_ci_to_pass: true

flag_management:
  default_rules:
    carryforward: true

flags:
  r:
    paths:
      - R/
    carryforward: true
  python:
    paths:
      - inst/python/diff_cs/
    carryforward: true
  jax:
    paths:
      - inst/python/diffiscape_jax/
    carryforward: true

# Components surface per-language coverage in the Codecov dashboard.
component_management:
  individual_components:
    - component_id: r_package
      name: R package
      paths:
        - R/
    - component_id: python_torch
      name: Python torch backend
      paths:
        - inst/python/diff_cs/
    - component_id: python_jax
      name: Python JAX backend
      paths:
        - inst/python/diffiscape_jax/

coverage:
  status:
    # Informational only — coverage is a signal here, not a merge gate.
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "header, flags, components, files"
  require_changes: false
