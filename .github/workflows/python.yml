name: Python CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'python/**'
      - '.github/workflows/python.yml'
  pull_request:
    paths:
      - 'python/**'
      - '.github/workflows/python.yml'

jobs:
  test-jax:
    name: Python 3.12 (installed JAX package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/constraints-cpu.txt
      - name: Install tested CPU stack and build packages
        run: |
          python -m pip install -c python/constraints-cpu.txt './python[dev]'
          python -m build python
          python -m pip install --no-deps --force-reinstall python/dist/*.whl
      - name: Test installed wheel outside source directory
        working-directory: ${{ runner.temp }}
        run: |
          python -m pytest "$GITHUB_WORKSPACE/python/tests" --cov=diffiscape --cov-report=xml:coverage-jax.xml -v
      - name: Test source distribution installation
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install --no-deps --force-reinstall "$GITHUB_WORKSPACE"/python/dist/*.tar.gz
          python -m pytest "$GITHUB_WORKSPACE/python/tests/test_api.py" -q
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: python/dist/*
      - uses: codecov/codecov-action@v4
        with:
          files: ${{ runner.temp }}/coverage-jax.xml
          flags: jax
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
