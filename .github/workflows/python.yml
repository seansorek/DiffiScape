name: Python CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'inst/python/**'
      - '.github/workflows/python.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'inst/python/**'
      - '.github/workflows/python.yml'

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check inst/python/
        continue-on-error: true

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: inst/python/diff_cs/requirements.txt

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r inst/python/diff_cs/requirements.txt pytest-cov

      - name: Run tests with coverage
        working-directory: inst/python
        run: |
          pytest tests/ \
            --cov=diff_cs \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          files: inst/python/coverage.xml
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
