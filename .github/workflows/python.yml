name: Python CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Python 3.11

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: inst/python/diff_cs/requirements.txt

      - name: Install dependencies
        run: pip install -r inst/python/diff_cs/requirements.txt pytest-cov

      - name: Run tests with coverage
        working-directory: inst/python
        run: |
          pytest tests/ \
            --cov=diff_cs \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - uses: codecov/codecov-action@v4
        with:
          files: inst/python/coverage.xml
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
