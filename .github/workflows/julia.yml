name: Julia CI

on:
  push:
    branches: [main, master]
    paths:
      - 'inst/julia/**'
      - '.github/workflows/julia.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'inst/julia/**'
      - '.github/workflows/julia.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    name: Julia ${{ matrix.julia-version }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1']

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2

      - name: Instantiate project
        working-directory: inst/julia/DiffiScape
        run: julia --project=. -e 'import Pkg; Pkg.instantiate()'

      - name: Run tests with coverage
        working-directory: inst/julia/DiffiScape
        run: julia --project=. --code-coverage=all test/runtests.jl

      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.julia-version == '1'
        with:
          directories: inst/julia/DiffiScape/src

      - uses: codecov/codecov-action@v4
        if: matrix.julia-version == '1'
        with:
          files: lcov.info
          flags: julia
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
