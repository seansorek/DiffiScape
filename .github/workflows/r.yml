# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
    paths:
      - 'R/**'
      - 'tests/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '**.R'
      - '.github/workflows/r.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'R/**'
      - 'tests/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '**.R'
      - '.github/workflows/r.yml'

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    continue-on-error: ${{ matrix.config.experimental == true }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release',  experimental: false}
          - {os: windows-latest, r: 'release',  experimental: false}
          - {os: ubuntu-latest,  r: 'release',  experimental: false, upload-coverage: true}
          - {os: ubuntu-latest,  r: 'devel',    experimental: true,  http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1', experimental: true}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: >-
            any::rcmdcheck
            ${{ matrix.config.upload-coverage == true && 'any::covr any::xml2' || '' }}
          needs: check

      - name: Lint R code
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        run: |
          if (!requireNamespace("lintr", quietly = TRUE)) install.packages("lintr")
          lintr::lint_package(linters = lintr::linters_with_defaults())
        shell: Rscript {0}
        continue-on-error: true

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true

      - name: Generate R coverage
        if: matrix.config.upload-coverage == true
        run: |
          covr::codecov(
            token = "${{ secrets.CODECOV_TOKEN }}",
            flags = "r",
            quiet = FALSE
          )
        shell: Rscript {0}
